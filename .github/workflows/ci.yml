name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm test
      # The e2e suite drives the real SPA served from web/dist, not the static
      # demo pages it used to. web/dist is gitignored, so without this step
      # Playwright would load the server's SPA fallback against a missing
      # index.html and every spec would fail on a blank page.
      - run: npm run build:web
      - run: npm run e2e
      # --omit=dev scopes this to the deployed app's actual runtime
      # dependency tree, not the whole repo's. Everything under
      # devDependencies (vite, react-router-dom, typescript, etc.) is
      # bundled by `npm run build:web` into static browser output --
      # the Node/Fastify process this CI job just tested and the
      # Dockerfile's runtime stage never import or execute any of it.
      # An advisory confined to devDependencies (e.g. a react-router
      # RSC-mode issue this app doesn't use, since it's a plain
      # client-rendered SPA) is real signal for a dependency someone
      # should eventually update, but it is not a vulnerability in
      # what's actually running in production, so it shouldn't gate a
      # green build the way a runtime-dependency finding should.
      - run: npm audit --omit=dev --audit-level=high
